<!doctype html>
<html lang="ko" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b2018">
<title>WeJJoy</title>
<link rel="icon" href="stickers/couple_01_love_hug.svg">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 상단바 -->
  <header class="toolbar">
    <div class="tb-title">WeJJoy</div>
    <div class="tb-actions">
      <button id="btnSearch" class="tb-btn" title="검색" aria-label="검색">🔍</button>
      <button id="btnShare" class="tb-btn" title="공유" aria-label="공유">👥</button>
      <button id="btnSettings" class="tb-btn" title="설정" aria-label="설정">⚙️</button>
    </div>
  </header>

  <!-- 달력 영역 -->
  <section id="headerArea" class="header-area">
    <div class="month-row">
      <button id="monthTitle" class="month-title">2026년 8월</button>
      <button id="btnToday" class="btn-today">오늘</button>
      <button id="btnPrev" class="icon-btn" aria-label="이전 달">‹</button>
      <button id="btnNext" class="icon-btn" aria-label="다음 달">›</button>
    </div>
    <div id="calendar" class="calendar"></div>
    <div class="hr"></div>
  </section>

  <!-- 선택한 날짜 정보 + 목록 -->
  <section class="list-area">
    <div class="sel-row">
      <span id="selDate" class="sel-date">오늘</span>
      <span id="selLunar" class="sel-lunar"></span>
    </div>
    <div id="selInfo" class="sel-info"></div>
    <div id="entryList" class="entry-list"></div>
    <div id="emptyMsg" class="empty-msg" hidden>이 날의 기록이 없습니다.<br>아래 + 버튼으로 추가하세요.</div>
  </section>

  <button id="fabAdd" class="fab" aria-label="일기 추가">+</button>
  <div id="statusBar" class="status-bar" hidden></div>
</div>

<!-- ===== 일기 편집 모달 ===== -->
<div id="editorModal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <button id="edCancel" class="link-btn">취소</button>
      <div class="sheet-title" id="edTitle">일기</div>
      <button id="edSave" class="link-btn strong">저장</button>
    </div>
    <div class="sheet-body">
      <input id="edTitleInput" class="field" placeholder="제목">
      <textarea id="edContent" class="field area" placeholder="내용을 적어보세요"></textarea>

      <div class="field-label">날짜 · 시간</div>
      <div class="row">
        <input id="edDate" type="date" class="field small">
        <select id="edStart" class="field small"></select>
      </div>
      <label class="chk"><input type="checkbox" id="edUseEnd"> 종료 시간/여러 날</label>
      <div class="row" id="edEndRow" hidden>
        <input id="edEndDate" type="date" class="field small">
        <select id="edEnd" class="field small"></select>
      </div>

      <div class="field-label">기분 이모지</div>
      <div id="moodRow" class="mood-row"></div>
      <div class="field-label">이모티콘 · 넣을 곳 고르고 아래에서 선택</div>
      <div id="stickerModeRow" class="seg segmini"></div>
      <div id="stickerRow" class="sticker-row"></div>

      <div class="field-label">중요도 <span id="impVal">50%</span></div>
      <input id="edImp" type="range" min="1" max="100" value="50" class="slider">

      <div class="field-label">태그 (쉼표로 구분)</div>
      <input id="edTags" class="field" placeholder="예: 데이트, 기념일">

      <div class="field-label">사진</div>
      <div id="photoRow" class="photo-row"></div>
      <input id="edPhoto" type="file" accept="image/*" hidden>
      <button id="edAddPhoto" class="ghost-btn">＋ 사진 추가</button>

      <button id="edDelete" class="danger-btn" hidden>이 일기 삭제</button>
    </div>
  </div>
</div>

<!-- ===== 설정 모달 ===== -->
<div id="settingsModal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <span></span><div class="sheet-title">설정</div>
      <button id="setClose" class="link-btn strong">닫기</button>
    </div>
    <div class="sheet-body">
      <div class="field-label">화면 모드</div>
      <div id="modeRow" class="seg"></div>
      <div class="field-label">디자인 색상</div>
      <div id="themeRow" class="theme-grid"></div>
    </div>
  </div>
</div>

<!-- ===== 공유 모달 ===== -->
<div id="shareModal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <span></span><div class="sheet-title">공유</div>
      <button id="shClose" class="link-btn strong">닫기</button>
    </div>
    <div class="sheet-body" id="shareBody"></div>
  </div>
</div>

<!-- ===== 검색 모달 ===== -->
<div id="searchModal" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <span></span><div class="sheet-title">검색</div>
      <button id="scClose" class="link-btn strong">닫기</button>
    </div>
    <div class="sheet-body">
      <input id="scInput" class="field" placeholder="제목·내용·태그 검색">
      <div id="scResults" class="entry-list"></div>
    </div>
  </div>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
