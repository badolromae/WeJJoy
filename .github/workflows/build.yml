name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug-keystore.b64 ]; then
            base64 -d debug-keystore.b64 > ~/.android/debug.keystore
            echo "고정 서명키 사용 - 기존 앱 위에 업데이트 설치 가능"
          else
            echo "debug-keystore.b64 파일이 없습니다. 매번 다른 임시 키가 만들어져 업데이트 설치가 안 됩니다."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDiary-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
