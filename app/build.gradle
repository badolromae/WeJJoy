plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.jooshin.diary'
    compileSdk 34

    defaultConfig {
        applicationId "com.jooshin.wejjoy"   // EnJJoy 와 나란히 설치되도록 다른 ID
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "2.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // 고정 서명키를 "확실한" 경로로 지정한다.
    // 예전에는 CI가 ~/.android/debug.keystore 에 키를 복사해두고 안드로이드 그레이들 플러그인의
    // 기본 위치 추정에 맡겼는데, 빌드 서버 환경에 따라 그 기본 위치가 실제로 다르게 잡혀서
    // 우리가 복사해둔 키가 아니라 그때그때 새로 만들어진 키로 서명되는 경우가 있었다.
    // (그러면 빌드마다 서명이 달라져서, 업데이트 설치가 안 되고 매번 기존 앱을 지워야 했다)
    // 여기서는 저장소 바로 아래(rootProject) 의 debug.keystore 파일을 직접 못박아 가리키므로
    // 그런 추정이 끼어들 여지가 없다. (이 파일은 CI가 debug-keystore.b64 를 풀어서 만든다.
    // 로컬에서 이 파일 없이 빌드하면 평소처럼 그레이들 기본 디버그 키를 그대로 쓴다.)
    signingConfigs {
        debug {
            def fixedDebugKeystore = rootProject.file('debug.keystore')
            if (fixedDebugKeystore.exists()) {
                storeFile fixedDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // 공유(실시간 동기화)용 Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'   // 사진 공유(선택 — Storage 버킷 설정 시에만 사용)

    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
